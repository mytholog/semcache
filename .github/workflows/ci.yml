name: ci

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    # Тесты стора не мокают Postgres: инвалидация должна быть атомарной в базе,
    # а не в подделке. Без DSN они пропускаются, поэтому база поднимается здесь.
    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_USER: semcache
          POSTGRES_PASSWORD: semcache
          POSTGRES_DB: semcache
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U semcache"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: gofmt
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "gofmt needed:"; echo "$unformatted"; exit 1
          fi
      - name: vet
        run: go vet ./...
      - name: build
        run: go build ./...
      - name: test
        run: go test -race ./...
        env:
          SEMCACHE_TEST_DSN: postgres://semcache:semcache@localhost:5432/semcache?sslmode=disable
